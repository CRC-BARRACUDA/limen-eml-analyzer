# Standalone package (it lives inside the Limen repo tree but is its own module).
[workspace]

[package]
name = "eml-analyzer"
version = "0.3.3"
edition = "2021"
description = "Deep static analysis and triage of .eml files for Limen DFIR."
repository = "https://github.com/CRC-BARRACUDA/limen-eml-analyzer"
license = "GPL-3.0-or-later"

[lib]
name = "eml_analyzer"
crate-type = ["cdylib"]

[dependencies]
limen-sdk-rust = { git = "https://github.com/CRC-BARRACUDA/Limen.git" }
mailparse = "0.14"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
regex = "1.10"
zip = { version = "0.6", default-features = false }