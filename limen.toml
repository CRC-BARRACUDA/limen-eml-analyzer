[module]
name = "eml-analyzer"
display_name = "EML Analyzer"
description = "Deep static analysis and triage of .eml (email) files. Uncovers hidden payloads, bypasses MIME obfuscation, and scores threats using a SpamAssassin-lite heuristic engine."
version = "0.7.0"
language = "native"
entry = "eml_analyzer"
abi = "native"
authors = ["Limen"]
repo = "CRC-BARRACUDA/limen-eml-analyzer"
tags = ["limen", "security", "email", "phishing", "forensics", "dfir", "local"]

[provides]
capabilities = ["eml.triage"]

[optional.capabilities]
"osint.reputation" = ">=0.1"
# When a report provider is installed, a "Make Report" action appears on the
# dashboard. Optional: the analysis stands on its own without it.
"report.build" = ">=0.1"

[permissions]
filesystem = ["<user-selected>"]